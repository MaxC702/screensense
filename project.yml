name: ScreenBlock

options:
  bundleIdPrefix: com.screenblock
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  # ---------------------------------------------------------------- container
  ScreenBlock:
    type: application
    platform: iOS
    sources:
      - path: ScreenBlock
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        INFOPLIST_FILE: ScreenBlock/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScreenBlock/ScreenBlock.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: Monitor
        embed: true
      - target: ShieldConfig
        embed: true
      - target: ShieldAction
        embed: true

  # ------------------------------------------------- re-applies the block late
  # Wakes up out-of-process when a break's usage threshold or time window ends.
  # This is what makes the block survive the app being force-quit.
  Monitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Monitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).monitor
        INFOPLIST_FILE: Monitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: Monitor/Monitor.entitlements
        GENERATE_INFOPLIST_FILE: NO

  # ------------------------------------------------------ draws the block screen
  ShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfig
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).shieldconfig
        INFOPLIST_FILE: ShieldConfig/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldConfig/ShieldConfig.entitlements
        GENERATE_INFOPLIST_FILE: NO

  # -------------------------------------- handles taps on the block screen buttons
  # Starts a break directly from the shield, so you never have to open ScreenBlock.
  ShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldAction
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).shieldaction
        INFOPLIST_FILE: ShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldAction/ShieldAction.entitlements
        GENERATE_INFOPLIST_FILE: NO

schemes:
  ScreenBlock:
    build:
      targets:
        ScreenBlock: all
    run:
      config: Debug
    archive:
      config: Release
